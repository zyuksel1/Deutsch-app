<script>
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js");
  // Yeni sürüm yüklenince haber ver (ilerleme etkilenmez)
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadSW || document.getElementById("updBar")) return;
    const d = document.createElement("div"); d.id = "updBar"; d.className = "updbar";
    d.innerHTML = 'Yeni sürüm hazır. <button class="primary small" onclick="location.reload()">Yenile</button>';
    document.body.appendChild(d);
  });
}
</script>
